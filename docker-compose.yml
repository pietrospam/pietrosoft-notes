services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    volumes:
      - ./data:/data
      - ./backups:/backups  # Backup storage directory
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pietrosoft_notes
      - WORKSPACE_PATH=/data
      - BACKUP_DIR=/backups
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pietrosoft_notes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: Auto-backup cron container
  # Uncomment to enable automatic backups without external cron
  # backup-cron:
  #   image: alpine:latest
  #   command: >
  #     sh -c "apk add --no-cache curl &&
  #            echo '0 * * * * curl -s -X POST http://app:3000/api/backups/auto' | crontab - &&
  #            crond -f -l 2"
  #   depends_on:
  #     - app
  #   restart: unless-stopped

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
