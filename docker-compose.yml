name: bitacora

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_HOST_PORT:-3001}:3000"
    volumes:
      - ./data:/data
      - ${BACKUP_HOST_DIR:-./backups}:/backups  # Backup storage directory
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/${DATABASE_NAME:-bitacora}
      - WORKSPACE_PATH=/data
      - BACKUP_DIR=/backups
      - NODE_ENV=production
      - APP_ENV=${APP_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=${DATABASE_NAME:-bitacora}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: Auto-backup cron container
  # Uncomment to enable automatic backups without external cron
  # backup-cron:
  #   image: alpine:latest
  #   command: >
  #     sh -c "apk add --no-cache curl &&
  #            echo '0 * * * * curl -s -X POST http://app:3000/api/backups/auto' | crontab - &&
  #            crond -f -l 2"
  #   depends_on:
  #     - app
  #   restart: unless-stopped

  # REQ-022: Automations cron container
  # Runs every minute and calls the centralized automations endpoint
  automations-cron:
    image: alpine:latest
    command: >
      sh -c "apk add --no-cache curl &&
             echo '* * * * * curl -s -X POST http://app:3000/api/automations' | crontab - &&
             crond -f -l 2"
    depends_on:
      - app
    restart: unless-stopped

  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_HOST_PORT:-8080}:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-bitacora_postgres_data}
